name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS (Apple Clang)
            os: macos-latest
          - name: Windows (MSVC)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # Every test but the torture test (labelled torture), the ones labelled slow included, on
        # every system. The torture test is too heavy for the runners; it runs locally in the
        # full preset before every merge.
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4 -LE torture

      - name: Package
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          find build -maxdepth 3 -type f \( -name 'raythrower' -o -name 'rayengine' -o -name 'raythrower.exe' -o -name 'rayengine.exe' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Upload programs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ray-${{ runner.os }}-${{ matrix.cc || 'default' }}
          path: dist/
          if-no-files-found: warn

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 4 -LE torture

  editor:
    name: Scene editor (wxWidgets, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and OpenGL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev

      # The fetched wxWidgets build is the slow part; keep it between runs.
      - name: Cache wxWidgets
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/wxwidgets-src
            build/_deps/wxwidgets-build
            build/_deps/wxwidgets-subbuild
          key: wxwidgets-3.2.9-${{ runner.os }}-${{ hashFiles('cmake/RayEditor.cmake') }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAY_BUILD_EDITOR=ON -DRAY_BUILD_TESTS=OFF -DRAY_USE_SYSTEM_WXWIDGETS=OFF

      - name: Build
        run: cmake --build build --config Release --target ray-editor --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$(find build -name 'ray-editor.app' -type d | head -1)" dist/
          else
            find build -type f \( -name 'ray-editor' -o -name 'ray-editor.exe' \) -exec cp {} dist/ \;
          fi
          ls -la dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ray-editor-${{ runner.os }}
          path: dist/
          if-no-files-found: error
