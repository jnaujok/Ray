name: Release

# Builds the programs for Linux, macOS and Windows, a .deb, an .rpm and a Flatpak bundle, tests the
# packages in clean containers, and publishes it all as a GitHub Release (a prerelease: these are
# alphas). Pushing a 2026-alpha-* tag starts it; an older tag can be built by hand: Actions >
# Release > Run workflow, or `gh workflow run release.yml -f tag=<tag>`. To try the workflow on a
# branch without publishing: `gh workflow run release.yml --ref <branch> -f tag=<a name> -f ref=<branch>
# -f publish=false`.

on:
  push:
    tags: ['2026-alpha-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build and release (it must already exist, unless publish is off)'
        required: true
      ref:
        description: 'Build this branch or commit instead of the tag (for trying the workflow)'
        required: false
        default: ''
      publish:
        description: 'Publish the GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stage: ${{ steps.version.outputs.stage }}
    steps:
      # 2026-alpha-0.21.2 is version 0.21.2, stage alpha: the packages carry 0.21.2~alpha (deb)
      # and 0.21.2-0.alpha (rpm), which sort before a final 0.21.2.
      - id: version
        run: |
          if [[ "$TAG" =~ ^[0-9]{4}-([a-z]+)-([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "stage=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "stage=test" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}

      - name: Install GTK and OpenGL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev

      # The fetched wxWidgets build is the slow part; keep it between runs (separate from CI's
      # cache, since the Windows build here uses the static C++ runtime).
      - name: Cache wxWidgets
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/wxwidgets-src
            build/_deps/wxwidgets-build
            build/_deps/wxwidgets-subbuild
            build-editor/_deps/wxwidgets-src
            build-editor/_deps/wxwidgets-build
            build-editor/_deps/wxwidgets-subbuild
          key: release-wxwidgets-3.2.9-${{ runner.os }}-${{ hashFiles('cmake/RayEditor.cmake') }}

      - name: Configure
        shell: bash
        run: |
          ARGS=(-DCMAKE_BUILD_TYPE=Release -DRAY_BUILD_TESTS=OFF -DRAY_USE_SYSTEM_WXWIDGETS=OFF)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # raythrower and rayengine with the static C++ runtime, so they need no Visual C++
            # Redistributable; ray-editor is built apart (below), since the editor's build keeps
            # wxWidgets on the shared runtime.
            cmake -S . -B build "${ARGS[@]}" -DRAY_BUILD_EDITOR=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          else
            cmake -S . -B build "${ARGS[@]}" -DRAY_BUILD_EDITOR=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Build the wxWidgets editor
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build-editor -DRAY_BUILD_TESTS=OFF -DRAY_USE_SYSTEM_WXWIDGETS=OFF -DRAY_BUILD_EDITOR=ON
          cmake --build build-editor --config Release --target ray-editor --parallel 4

      - name: Package
        shell: bash
        run: |
          NAME="ray-${TAG}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME"
          if [ "$RUNNER_OS" = "Windows" ]; then
            for program in raythrower rayengine; do
              cp "$(find build -type f -name "$program.exe" | head -1)" "dist/$NAME/"
            done
            cp "$(find build-editor -type f -name 'ray-editor.exe' | head -1)" "dist/$NAME/"
          else
            for program in raythrower rayengine; do
              cp "$(find build -type f -name "$program" -perm -u+x | head -1)" "dist/$NAME/"
            done
            if [ "$RUNNER_OS" = "macOS" ]; then
              cp -R "$(find build -name 'ray-editor.app' -type d | head -1)" "dist/$NAME/"
            else
              # The editor behind a launcher that checks for GTK, OpenGL and a display first.
              mkdir -p "dist/$NAME/bin"
              cp "$(find build -type f -name 'ray-editor' -perm -u+x | head -1)" "dist/$NAME/bin/ray-editor-bin"
              cp packaging/linux/ray-editor.sh "dist/$NAME/ray-editor"
              chmod +x "dist/$NAME/ray-editor"
            fi
          fi
          cp LICENSE NOTICE README.md CHANGELOG.md "dist/$NAME/"
          cp -R scenes "dist/$NAME/"

          # A quick render, to show the program runs where it was built.
          RAYTHROWER="dist/$NAME/raythrower"
          [ "$RUNNER_OS" = "Windows" ] && RAYTHROWER="$RAYTHROWER.exe"
          "$RAYTHROWER" "dist/$NAME/scenes/scan_test.ray" -q --size 64x48 -o smoke.raw

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="$NAME.zip"
            7z a -tzip -bd "$ARCHIVE" "$NAME" > /dev/null
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            ARCHIVE="$NAME.tar.gz"
            tar -czf "$ARCHIVE" "$NAME"
            if command -v sha256sum > /dev/null; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi
          fi
          rm -rf "$NAME"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # A .deb built on the oldest Ubuntu runner, so its C library suits Ubuntu 22.04 and Debian 12
  # and later.
  deb:
    name: .deb
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev lintian
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAY_BUILD_EDITOR=ON -DRAY_BUILD_TESTS=OFF \
                -DRAY_USE_SYSTEM_WXWIDGETS=OFF -DCMAKE_INSTALL_PREFIX=/usr \
                -DRAY_PACKAGE_VERSION=${{ needs.version.outputs.version }} -DRAY_PACKAGE_STAGE=${{ needs.version.outputs.stage }}
          cmake --build build --parallel 4
      - name: Package
        run: |
          cd build
          cpack -G DEB
          mkdir -p ../dist
          cp ray_*.deb "../dist/ray-${TAG}-amd64.deb"
          cd ../dist
          dpkg-deb --info "ray-${TAG}-amd64.deb"
          sha256sum "ray-${TAG}-amd64.deb" > "ray-${TAG}-amd64.deb.sha256"
      - name: Lintian
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/
          if-no-files-found: error

  # An .rpm built on Rocky Linux 9, for RHEL, Rocky and Alma 9 and later, and Fedora.
  rpm:
    name: .rpm
    needs: version
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install tools
        run: dnf install -y gcc-c++ cmake make git gtk3-devel mesa-libGL-devel mesa-libGLU-devel rpm-build gzip
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAY_BUILD_EDITOR=ON -DRAY_BUILD_TESTS=OFF \
                -DRAY_USE_SYSTEM_WXWIDGETS=OFF -DRAY_USE_CCACHE=OFF -DCMAKE_INSTALL_PREFIX=/usr \
                -DRAY_PACKAGE_VERSION=${{ needs.version.outputs.version }} -DRAY_PACKAGE_STAGE=${{ needs.version.outputs.stage }}
          cmake --build build --parallel 4
      - name: Package
        run: |
          cd build
          cpack -G RPM
          mkdir -p ../dist
          cp ray-*.rpm "../dist/ray-${TAG}.x86_64.rpm"
          cd ../dist
          rpm -qip "ray-${TAG}.x86_64.rpm"
          rpm -qpR "ray-${TAG}.x86_64.rpm"
          sha256sum "ray-${TAG}.x86_64.rpm" > "ray-${TAG}.x86_64.rpm.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: package-rpm
          path: dist/
          if-no-files-found: error

  # Each package installed in clean containers, its dependencies pulled in by the package manager,
  # then a small render.
  packages-test:
    name: Install on ${{ matrix.image }}
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            kind: deb
          - image: debian:12
            kind: deb
          - image: rockylinux:9
            kind: rpm
          - image: fedora:latest
            kind: rpm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.kind }}
          path: dist
      - name: Install
        run: |
          if [ "${{ matrix.kind }}" = "deb" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ./dist/*.deb
          else
            dnf install -y ./dist/*.rpm
            if [ "${{ matrix.image }}" = "fedora:latest" ]; then
              dnf install -y rpmlint && (rpmlint dist/*.rpm || true)
            fi
          fi
      - name: Run
        run: |
          raythrower --help | head -3
          raythrower /usr/share/ray/scenes/scan_test.ray -q --size 64x48 -o /tmp/smoke.raw
          test -s /tmp/smoke.raw
          missing=$(ldd /usr/bin/ray-editor | grep "not found" || true)
          if [ -n "$missing" ]; then echo "ray-editor is missing libraries:"; echo "$missing"; exit 1; fi
          test -f /usr/share/applications/io.github.jnaujok.Ray.desktop
          echo "installed and rendered on ${{ matrix.image }}"

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - name: Install flatpak-builder and the GNOME runtime
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 keeps unprivileged user namespaces from bubblewrap, which flatpak-builder needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir \
                          packaging/flatpak/io.github.jnaujok.Ray.yml
          mkdir -p dist
          flatpak build-bundle repo "dist/ray-${TAG}.flatpak" io.github.jnaujok.Ray \
                               --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          cd dist
          sha256sum "ray-${TAG}.flatpak" > "ray-${TAG}.flatpak.sha256"
          ls -la
      - name: Try it
        run: |
          flatpak install --user -y --noninteractive "dist/ray-${TAG}.flatpak"
          # The sandbox's /tmp is its own; the home folder is shared.
          flatpak run --command=raythrower io.github.jnaujok.Ray /app/share/ray/scenes/scan_test.ray -q --size 64x48 \
                      -o "$HOME/flatpak-smoke.raw"
          test -s "$HOME/flatpak-smoke.raw"
          flatpak info io.github.jnaujok.Ray
      - uses: actions/upload-artifact@v4
        with:
          name: package-flatpak
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build, deb, rpm, packages-test, flatpak]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      # The workflow's own commit, for its scripts; the notes come from the tag's CHANGELOG.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{release,package}-*'
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          git show "$TAG:CHANGELOG.md" > tag-changelog.md
          python3 tools/changelog_section.py "$TAG" tag-changelog.md "$GITHUB_REPOSITORY" > notes.md
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          ls -la dist
          head -20 notes.md

      - name: Create the release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "Ray $TAG" --notes-file notes.md
          else
            gh release edit "$TAG" --prerelease --title "Ray $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.flatpak \
                                             dist/*.sha256 dist/SHA256SUMS.txt
          gh release view "$TAG"
